name: Build APK (Kivy / Buildozer)

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    # -------------------------
    # PYTHON
    # -------------------------
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # -------------------------
    # JAVA (FIX ERRORE PRINCIPALE)
    # -------------------------
    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    # -------------------------
    # SYSTEM DEPENDENCIES
    # -------------------------
    - name: Install system packages
      run: |
        sudo apt update
        sudo apt install -y git zip unzip wget openjdk-17-jdk

    # -------------------------
    # PYTHON DEPENDENCIES
    # -------------------------
    - name: Install Buildozer
      run: |
        pip install --upgrade pip
        pip install buildozer cython

    # -------------------------
    # ANDROID SDK SETUP
    # -------------------------
    - name: Setup Android SDK
      run: |
        export ANDROID_HOME=$HOME/android-sdk
        mkdir -p $ANDROID_HOME

        echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
        echo "PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools" >> $GITHUB_ENV

        mkdir -p $ANDROID_HOME/cmdline-tools
        cd $ANDROID_HOME/cmdline-tools

        wget https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
        unzip commandlinetools-linux-11076708_latest.zip
        mv cmdline-tools latest

    # -------------------------
    # INSTALL SDK COMPONENTS (FIX AIDL)
    # -------------------------
    - name: Install Android SDK components
      run: |
        yes | sdkmanager --licenses

        sdkmanager "platform-tools" \
                   "platforms;android-34" \
                   "build-tools;34.0.0"

    # -------------------------
    # BUILD APK
    # -------------------------
    - name: Build APK
      run: |
        buildozer -v android debug

    # -------------------------
    # UPLOAD APK
    # -------------------------
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: apk
        path: bin/*.apk