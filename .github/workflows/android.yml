name: Build APK (FIX DEFINITIVO)

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    # -------------------------
    # PYTHON
    # -------------------------
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # -------------------------
    # JAVA 17 (OBBLIGATORIO)
    # -------------------------
    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    # -------------------------
    # SYSTEM DEPENDENCIES
    # -------------------------
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip wget openjdk-17-jdk

    # -------------------------
    # BUILD TOOL PYTHON
    # -------------------------
    - name: Install Buildozer
      run: |
        pip install --upgrade pip
        pip install cython buildozer

    # -------------------------
    # ANDROID SDK (FIX AIDL DEFINITIVO)
    # -------------------------
    - name: Install Android SDK manually
      run: |
        export ANDROID_HOME=$HOME/android-sdk
        mkdir -p $ANDROID_HOME

        cd $HOME
        wget https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
        unzip commandlinetools-linux-11076708_latest.zip -d $ANDROID_HOME

        mkdir -p $ANDROID_HOME/cmdline-tools/latest
        mv $ANDROID_HOME/cmdline-tools $ANDROID_HOME/cmdline-tools/latest || true

        export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin

        yes | sdkmanager --licenses

        sdkmanager \
          "platform-tools" \
          "platforms;android-34" \
          "build-tools;34.0.0"

    # -------------------------
    # BUILD
    # -------------------------
    - name: Build APK
      run: |
        export ANDROID_HOME=$HOME/android-sdk
        export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
        buildozer -v android debug

    # -------------------------
    # UPLOAD APK
    # -------------------------
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: apk
        path: bin/*.apk